  catalog_verified_through: '2026-09-04'
  note: >-
    Every figure records the date it was last verified against the exact
    government document it was read from. This is the provider's decay signal in
    place of a versioned changelog.
change_tracking:
  changes_page: https://ratesandlimits.com/changes
  corrections_page: https://ratesandlimits.com/corrections
  note: >-
    /changes lists figures that moved recently (each against the prior year);
    /corrections publishes every correction to a published figure and what it
    was corrected from. These track the DATA, not the API contract.
deprecation:
