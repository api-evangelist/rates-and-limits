summary: >-
  Rates and Limits versions its API in the URI path (v1) and publishes a
  freshness signal rather than a deprecation/sunset policy. Each program and the
  catalog carry a verified_through / verified_at date recording when the figure
  was last checked against its government source. There is no published Sunset
  or Deprecation header scheme and no formal SLA or status page.
versioning:
